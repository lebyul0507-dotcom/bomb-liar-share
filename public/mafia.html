<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEAM SYNC · MAFIA</title><script src="/socket.io/socket.io.js"></script>
<style>
:root{--excel:#107c41;--dark:#0b5f31;--soft:#e9f3ed;--grid:#d9d9d9;--text:#222;--muted:#666;--danger:#c62828}
*{box-sizing:border-box}body{margin:0;background:#ececec;color:var(--text);font-family:Aptos,Calibri,"Segoe UI",Arial,sans-serif}.app{max-width:1450px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 24px #0002}
.titlebar{height:94px;background:var(--excel);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.brand{font-size:28px;font-weight:900}.subtitle{font-size:16px;margin-top:5px}.subtitle a{color:#fff;font-weight:800}.menu{height:76px;background:#fff;border-bottom:1px solid #ccc}.menu-top{height:46px;display:flex;gap:28px;align-items:center;padding:0 30px;font-size:18px}.menu-top b{color:var(--excel)}.formula{height:30px;display:grid;grid-template-columns:82px 48px 1fr;border-top:1px solid #ddd}.formula>div{display:flex;align-items:center;padding:0 10px;border-right:1px solid #ddd;font-size:16px}
.sheet{min-height:900px;padding:82px 30px;background-image:linear-gradient(to right,#e5e5e5 1px,transparent 1px),linear-gradient(to bottom,#e5e5e5 1px,transparent 1px);background-size:118px 26px}
.entry{width:min(760px,calc(100vw - 64px));margin:0 auto;background:#fff;border:1px solid #999;padding:30px}.entry h1{font-size:34px;margin:0 0 18px}.entry p{font-size:18px;color:var(--muted);margin:0 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.tab{height:70px;border:1px solid #8a8a8a;background:#fff;font-size:20px;font-weight:800}.tab.active{background:#18212b;color:#fff;border-color:#18212b}
.stack{display:grid;gap:16px}.input{height:66px;width:100%;border:1px solid #aaa;padding:0 18px;font-size:20px}.mode{height:72px;border:1px solid #ddd;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:20px;color:#666}.action{height:70px;border:1px solid var(--dark);background:var(--excel);color:#fff;font-size:21px;font-weight:800}
.panel{width:min(980px,calc(100vw - 64px));margin:0 auto;background:#fff;border:1px solid #aaa}.panel-title{background:var(--excel);color:#fff;padding:10px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.panel-body{padding:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{height:38px;border:1px solid #888;background:#fff;padding:0 14px;font-weight:700}.btn.primary{background:var(--excel);color:#fff;border-color:var(--dark)}.btn.danger{border-color:var(--danger);color:var(--danger)}.hidden{display:none!important}
.table{width:100%;border-collapse:collapse;margin-top:14px}.table th,.table td{border:1px solid var(--grid);padding:10px}.table th{background:#f3f3f3}.host{font-size:11px;background:var(--soft);padding:2px 6px;margin-left:6px}.bot{font-size:11px;background:#f5f5f5;padding:2px 6px;margin-left:6px;color:#777}.dead{opacity:.5;text-decoration:line-through}
.notice{padding:12px;background:#f7f7f7;border-left:4px solid #999;margin:12px 0}.notice.good{background:var(--soft);border-left-color:var(--excel)}.notice.danger{background:#fdeaea;border-left-color:var(--danger)}.code{font:800 24px Consolas,monospace;letter-spacing:.13em;color:var(--dark)}
.role{padding:28px;text-align:center;border:2px solid var(--excel);background:#f5fbf7}.role .big{font-size:36px;font-weight:900;margin-bottom:8px}.timer{font-size:42px;font-weight:900;text-align:center;margin:18px 0}.choices{display:grid;gap:8px}.choice{display:flex;align-items:center;gap:10px;border:1px solid #bbb;padding:12px;background:#fff}.choice input{width:20px;height:20px;accent-color:var(--excel)}.stage{font-size:13px;color:#666;font-weight:800}.result-title{text-align:center;font-size:36px;font-weight:900;margin:12px 0 24px}
@media(max-width:700px){.titlebar{height:94px;padding:0 22px}.brand{font-size:25px}.menu-top{gap:22px;padding:0 28px;overflow:hidden;white-space:nowrap}.sheet{padding:82px 16px}.entry,.panel{width:100%}.entry{padding:28px 30px}.entry h1{font-size:32px}.tab{height:68px}.input{height:64px}}
</style>
</head>
<body><div class="app">
<div class="titlebar"><div><div class="brand">📊 TEAM SYNC</div><div class="subtitle">회사 마피아 게임　<a href="/">메인으로</a></div></div><div id="roomBadge" class="code" style="color:#fff;font-size:16px"></div></div>
<div class="menu"><div class="menu-top"><b>파일</b><span>홈</span><span>삽입</span><span>데이터</span><span>검토</span><span>보기</span></div><div class="formula"><div>A1</div><div style="font-style:italic">fx</div><div>TEAM SYNC / Mafia</div></div></div>
<main id="sheet" class="sheet"></main></div>
<script>
const socket=io();
const sheet=document.getElementById('sheet');
const store={room:null,playerId:localStorage.getItem('mafiaPlayerId')||'',code:localStorage.getItem('mafiaRoomCode')||'',name:localStorage.getItem('mafiaName')||'',timer:null};
const q=(s,r=document)=>r.querySelector(s);
const emit=(name,data={})=>new Promise(resolve=>socket.emit(name,data,resolve));
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>store.room?.players.find(p=>p.id===store.playerId);
const isHost=()=>store.room?.hostId===store.playerId;
function saveSession(code,id,name){store.code=code;store.playerId=id;store.name=name;localStorage.setItem('mafiaRoomCode',code);localStorage.setItem('mafiaPlayerId',id);localStorage.setItem('mafiaName',name)}
function clearSession(){store.room=null;store.code='';store.playerId='';localStorage.removeItem('mafiaRoomCode');localStorage.removeItem('mafiaPlayerId')}
function modeLabel(){return localStorage.getItem('teamSyncDeveloperMode')==='1'?'🛠 개발자 모드 ON · 혼자 테스트':'일반 멀티플레이 모드'}
function roleName(r){return {MAFIA:'마피아',DOCTOR:'의사',POLICE:'경찰',CITIZEN:'시민'}[r]||'-'}
function roleDesc(r){if(r==='MAFIA')return '밤마다 한 명을 제거합니다. 정체를 숨기세요.';if(r==='DOCTOR')return '밤마다 한 명을 치료해 살릴 수 있습니다.';if(r==='POLICE')return '밤마다 한 명을 조사합니다.';return '낮 토론과 투표로 마피아를 찾으세요.'}
function left(){if(!store.room?.timerEndsAt)return null;return Math.max(0,Math.ceil((store.room.timerEndsAt-Date.now())/1000))}
function fmt(sec){if(sec==null)return '∞';return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function startTicker(){if(store.timer)clearInterval(store.timer);store.timer=setInterval(()=>{const el=q('#timer');if(el)el.textContent=fmt(left())},500)}
function top(title){return '<div class="panel-title"><span>'+esc(title)+'</span>'+(isHost()?'<button id="stopBtn" class="btn danger">게임 중단</button>':'')+'</div>'}
function bindStop(){const b=q('#stopBtn');if(b)b.onclick=async()=>{if(confirm('현재 게임을 중단하고 대기실로 돌아갈까요?'))await emit('mafia:stop')}}
function playerRows(showRole=false){return store.room.players.map(p=>'<tr class="'+(p.alive?'':'dead')+'"><td>'+esc(p.name)+(p.id===store.room.hostId?'<span class="host">방장</span>':'')+(p.bot?'<span class="bot">TEST</span>':'')+'</td><td>'+(p.connected?'접속':'이탈')+'</td><td>'+(p.alive?'생존':'탈락')+'</td>'+(showRole?'<td>'+roleName(p.role)+'</td>':'')+'</tr>').join('')}
function renderHome(){
 const dev=localStorage.getItem('teamSyncDeveloperMode')==='1';
 sheet.innerHTML='<section class="entry"><h1>회사 마피아</h1><p>죽이고, 살리고, 조사하고. 4~6명이 함께하는 추리 게임.</p><div class="tabs"><button id="createTab" class="tab active">방 만들기</button><button id="joinTab" class="tab">참가하기</button></div><div class="stack"><input id="name" class="input" maxlength="12" placeholder="이름" value="'+esc(store.name)+'"><div id="codeWrap" class="hidden"><input id="code" class="input" maxlength="4" placeholder="방 코드 입력"></div><div class="mode" style="'+(dev?'background:#e9f3ed;color:#0b5f31':'')+'">'+modeLabel()+'</div><button id="createBtn" class="action">새 방 만들기</button><button id="joinBtn" class="action hidden">방 참가하기</button></div></section>';
 q('#createTab').onclick=()=>{q('#createTab').classList.add('active');q('#joinTab').classList.remove('active');q('#codeWrap').classList.add('hidden');q('#createBtn').classList.remove('hidden');q('#joinBtn').classList.add('hidden')};
 q('#joinTab').onclick=()=>{q('#joinTab').classList.add('active');q('#createTab').classList.remove('active');q('#codeWrap').classList.remove('hidden');q('#joinBtn').classList.remove('hidden');q('#createBtn').classList.add('hidden')};
 q('#createBtn').onclick=async()=>{const name=q('#name').value.trim();if(!name)return alert('이름을 입력하세요.');const r=await emit('mafia:create',{name});if(!r?.ok)return alert(r?.error||'생성 실패');saveSession(r.code,r.playerId,name);if(dev){const d=await emit('mafia:developerMode',{enabled:true});if(!d?.ok)alert(d?.error||'개발자 모드 설정 실패')}};
 q('#joinBtn').onclick=async()=>{const name=q('#name').value.trim(),code=q('#code').value.trim().toUpperCase();if(!name||!code)return alert('이름과 방 코드를 입력하세요.');const r=await emit('mafia:join',{code,name});if(!r?.ok)return alert(r?.error||'입장 실패');saveSession(r.code,r.playerId,name)};
}
function renderLobby(){const r=store.room;sheet.innerHTML='<section class="panel"><div class="panel-title">MAFIA / Session Setup</div><div class="panel-body"><div class="row between"><div><div style="color:#666">ROOM CODE</div><div class="code">'+esc(r.code)+'</div></div><b>'+r.players.length+' / 6</b></div>'+(r.developerMode?'<div class="notice good">🛠 개발자 모드 ON · 테스트 인원을 자동으로 채웁니다.</div>':'<div class="notice">일반 모드 · 4~6명에서 시작할 수 있습니다.</div>')+'<table class="table"><thead><tr><th>이름</th><th>접속</th><th>상태</th></tr></thead><tbody>'+playerRows(false)+'</tbody></table><div class="row" style="margin-top:16px">'+(isHost()?'<button id="startBtn" class="btn primary">게임 시작</button>':'')+'<a href="/" class="btn" style="text-decoration:none;display:flex;align-items:center">메인으로</a></div></div></section>';const b=q('#startBtn');if(b)b.onclick=async()=>{const x=await emit('mafia:start');if(!x?.ok)alert(x?.error||'시작 실패')}}
function renderRole(){sheet.innerHTML='<section class="panel">'+top('ROLE REVEAL · ROUND '+store.room.round)+'<div class="panel-body"><div class="role"><div class="big">'+roleName(store.room.myRole)+'</div><p>'+esc(roleDesc(store.room.myRole))+'</p></div><button id="readyBtn" class="btn primary" style="margin-top:18px">역할 확인 완료</button></div></section>';bindStop();q('#readyBtn').onclick=()=>emit('mafia:role:ready')}
function renderDay(){sheet.innerHTML='<section class="panel">'+top('DAY '+store.room.round+' · 자유 토론')+'<div class="panel-body"><div id="timer" class="timer">'+fmt(left())+'</div><div class="notice">랜덤 질문 없이 자유 토론만 진행합니다.</div><table class="table"><thead><tr><th>이름</th><th>접속</th><th>상태</th></tr></thead><tbody>'+playerRows(false)+'</tbody></table>'+(isHost()?'<button id="nextBtn" class="btn primary" style="margin-top:16px">투표로 이동</button>':'')+'</div></section>';bindStop();const b=q('#nextBtn');if(b)b.onclick=()=>emit('mafia:day:skip')}
function renderVote(){const r=store.room,m=me(),choices=r.players.filter(p=>p.alive&&p.id!==store.playerId);sheet.innerHTML='<section class="panel">'+top('DAY '+r.round+' · 마피아 지목 투표')+'<div class="panel-body"><div class="notice">투표 완료 '+r.voteCount+'명</div>'+(m?.alive?'<div>'+choices.map(p=>'<label class="choice"><input type="radio" name="vote" value="'+p.id+'">'+esc(p.name)+(p.bot?' · TEST':'')+'</label>').join('')+'</div><button id="voteBtn" class="btn primary">투표 제출</button>':'<div class="notice">탈락하여 관전 중입니다.</div>')+(isHost()?'<button id="finishBtn" class="btn" style="margin-left:8px">현재 투표로 마감</button>':'')+'</div></section>';bindStop();const vb=q('#voteBtn');if(vb)vb.onclick=async()=>{const x=q('input[name=vote]:checked');if(!x)return alert('대상을 선택하세요.');const y=await emit('mafia:vote',{targetId:x.value});if(!y?.ok)alert(y.error)};const fb=q('#finishBtn');if(fb)fb.onclick=()=>emit('mafia:vote:finish')}
function candidate(){return store.room.players.find(p=>p.id===store.room.candidate)}
function renderDefense(){const c=candidate();sheet.innerHTML='<section class="panel">'+top('FINAL DEFENSE')+'<div class="panel-body" style="text-align:center"><h2>'+esc(c?.name||'-')+' 님 최후 변론</h2><div id="timer" class="timer">'+fmt(left())+'</div>'+(isHost()?'<button id="nextBtn" class="btn primary">처형 투표로 이동</button>':'')+'</div></section>';bindStop();const b=q('#nextBtn');if(b)b.onclick=()=>emit('mafia:defense:skip')}
function renderExecute(){const c=candidate(),m=me(),can=m?.alive&&m.id!==c?.id;sheet.innerHTML='<section class="panel">'+top('EXECUTION VOTE')+'<div class="panel-body" style="text-align:center"><h2>'+esc(c?.name||'-')+' 님을 처형할까요?</h2>'+(can?'<div class="row" style="justify-content:center"><button id="yesBtn" class="btn danger">처형</button><button id="noBtn" class="btn">살려두기</button></div>':'<div class="notice">후보자 또는 탈락자는 투표할 수 없습니다.</div>')+(isHost()?'<button id="finishBtn" class="btn primary" style="margin-top:16px">현재 표로 마감</button>':'')+'</div></section>';bindStop();const y=q('#yesBtn'),n=q('#noBtn'),f=q('#finishBtn');if(y)y.onclick=()=>emit('mafia:execute',{yes:true});if(n)n.onclick=()=>emit('mafia:execute',{yes:false});if(f)f.onclick=()=>emit('mafia:execute:finish')}
function renderNight(){const r=store.room,m=me(),role=r.myRole;let kind='',title='밤 행동 대기 중';if(role==='MAFIA'){kind='kill';title='오늘 제거할 사람'}else if(role==='DOCTOR'){kind='save';title='오늘 치료할 사람'}else if(role==='POLICE'){kind='inspect';title='오늘 조사할 사람'}let body='<div class="notice">시민은 밤 동안 기다립니다.</div>';if(!m?.alive)body='<div class="notice">탈락하여 관전 중입니다.</div>';else if(kind){const opts=r.players.filter(p=>p.alive&&(kind==='save'||p.id!==store.playerId));body='<h2>'+esc(title)+'</h2>'+opts.map(p=>'<label class="choice"><input type="radio" name="night" value="'+p.id+'">'+esc(p.name)+'</label>').join('')+'<button id="nightBtn" class="btn primary">선택 완료</button>';if(r.myNightResult)body+='<div class="notice good">조사 결과: <b>'+esc(r.myNightResult.targetName)+'</b> 님은 <b>'+(r.myNightResult.isMafia?'마피아입니다':'마피아가 아닙니다')+'</b>.</div>'}sheet.innerHTML='<section class="panel">'+top('NIGHT '+r.round)+'<div class="panel-body">'+body+(isHost()?'<button id="finishBtn" class="btn" style="margin-top:16px">밤 행동 마감</button>':'')+'</div></section>';bindStop();const nb=q('#nightBtn');if(nb)nb.onclick=async()=>{const x=q('input[name=night]:checked');if(!x)return alert('대상을 선택하세요.');const y=await emit('mafia:night',{kind,targetId:x.value});if(!y?.ok)alert(y.error)};const fb=q('#finishBtn');if(fb)fb.onclick=()=>emit('mafia:night:finish')}
function renderMorning(){const last=store.room.log[store.room.log.length-1]||'사망자 없음';sheet.innerHTML='<section class="panel">'+top('MORNING')+'<div class="panel-body" style="text-align:center"><h2>'+esc(last.replace(/^NIGHT \d+: /,''))+'</h2>'+(isHost()?'<button id="nextBtn" class="btn primary">다음 DAY 시작</button>':'')+'</div></section>';bindStop();const b=q('#nextBtn');if(b)b.onclick=()=>emit('mafia:morning:next')}
function renderOver(){sheet.innerHTML='<section class="panel"><div class="panel-title">GAME OVER</div><div class="panel-body"><h1 style="text-align:center">'+(store.room.winner==='MAFIA'?'MAFIA WIN':'CITIZEN WIN')+'</h1><table class="table"><thead><tr><th>이름</th><th>접속</th><th>상태</th><th>역할</th></tr></thead><tbody>'+playerRows(true)+'</tbody></table>'+(isHost()?'<button id="backBtn" class="btn primary" style="margin-top:16px">대기실로 돌아가기</button>':'')+'</div></section>';const b=q('#backBtn');if(b)b.onclick=()=>emit('mafia:stop')}
function render(){if(!store.room)return renderHome();({LOBBY:renderLobby,ROLE:renderRole,DAY:renderDay,VOTE:renderVote,DEFENSE:renderDefense,EXECUTE:renderExecute,NIGHT:renderNight,MORNING:renderMorning,OVER:renderOver}[store.room.phase]||renderHome)()}
socket.on('connect',()=>{if(store.code&&store.playerId)socket.emit('mafia:join',{code:store.code,name:store.name,playerId:store.playerId},r=>{if(!r?.ok){clearSession();renderHome()}})});
socket.on('mafia:update',room=>{store.room=room;render();startTicker()});
renderHome();
</script></body></html>
